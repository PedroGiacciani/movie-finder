<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="separador">
        <header>
            <h1>Movie Finder</h1>
            <p>Procure por seus filmes favoritos</p>
        </header>
        <main>
            <section id="area-pesquisa">
                <p>Digite o nome do filme em inglês: <input type="text" name="nome-filme" id="inome-filme" placeholder="Ex: The Godfather"><button id="btn-pesquisa">Pesquisar</button></p>
            </section>
            <section id="area-card-filme">
                <!--Área que aparece o card do filme-->
                <p>Digite o nome do seu filme favorito para encontrá-lo!</p>
            </section>
        </main>
    </div>
    <footer>
        <p>&copy; Site desenvolvido por <a href="https://github.com/pedrogiacciani" target="_blank">Pedro Giacciani</a></p>
    </footer>
    <script type="module" src="scripts/app.js"></script>
</body>
</html>
